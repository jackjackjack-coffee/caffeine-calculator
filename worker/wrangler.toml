name = "caffeine-analyze"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# --- Secrets (NEVER commit real values) ---
# Production:  npx wrangler secret put GEMINI_API_KEY
# Local dev:   put GEMINI_API_KEY in worker/.dev.vars (gitignored)

[vars]
# Which provider/model the worker uses. Swap to Anthropic later via vision.ts.
VISION_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.0-flash"

# --- Abuse protection (optional but recommended before going public) ---
#
# 1) Shared app secret: shuts out third-party callers entirely.
#      npx wrangler secret put APP_KEY
#    and ship the same value in the app's X-App-Key header.
#
# 2) Per-IP rate limiting (Workers rate limiting binding):
# [[unsafe.bindings]]
# name = "ANALYZE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# # 20 requests per IP per 60 seconds
# simple = { limit = 20, period = 60 }
